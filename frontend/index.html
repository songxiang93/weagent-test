<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能对话系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    #app {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .chat-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 0.9rem;
    }

    .message.user .message-avatar {
      background: #667eea;
    }

    .message.assistant .message-avatar {
      background: #764ba2;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
    }

    .message.user .message-content {
      background: #667eea;
      color: white;
    }

    .message.assistant .message-content {
      background: #f1f1f1;
      color: #333;
    }

    .message-image {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .chat-input {
      border-top: 1px solid #eee;
      padding: 20px;
      background: white;
    }

    .input-container {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-group {
      flex: 1;
      display: flex;
      gap: 10px;
    }

    .message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 0.95rem;
      min-height: 48px;
      max-height: 120px;
    }

    .message-input:focus {
      border-color: #667eea;
    }

    .image-input {
      width: 48px;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-input:hover {
      border-color: #667eea;
    }

    .image-input input {
      display: none;
    }

    .send-button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .send-button:hover {
      transform: scale(1.05);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: loading 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes loading {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-container">
      <div class="chat-header">
        <h1>智能对话系统</h1>
        <p>支持文字和图片的多模态对话</p>
      </div>

      <div class="chat-messages" ref="messagesContainer">
        <div class="message assistant">
          <div class="message-avatar">AI</div>
          <div class="message-content">
            你好！我是智能对话助手。我可以理解文字和图片，有什么可以帮助你的吗？
          </div>
        </div>
      </div>

      <div class="chat-input">
        <div class="input-container">
          <div class="input-group">
            <textarea
              v-model="messageText"
              @keydown.enter.prevent="sendMessage"
              class="message-input"
              placeholder="输入消息..."
              rows="1"
            ></textarea>
            <label class="image-input">
              <input type="file" @change="handleImageUpload" accept="image/*">
              📷
            </label>
          </div>
          <button @click="sendMessage" :disabled="isSending || !messageText.trim()" class="send-button">
            ➤
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
